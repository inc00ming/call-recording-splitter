[project]
name = "call-recording-splitter"
version = "0.1.0"
description = "CLI that splits .m4a recordings into fixed-length parts with an ffmpeg stream copy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
split-recordings = "call_recording_splitter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_recording_splitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "ffmpeg: exercises the real ffmpeg/ffprobe binaries",
]
